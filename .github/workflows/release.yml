name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, asset: cleaner-macos-aarch64 }
          - { target: x86_64-apple-darwin, asset: cleaner-macos-x86_64 }
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml
        run: test "${GITHUB_REF_NAME#v}" = "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
      - run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - name: Build
        env:
          CLEANER_RELEASE: "1"
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/cleaner ${{ matrix.asset }}
      - if: matrix.target != 'x86_64-apple-darwin'
        run: ./${{ matrix.asset }} --version
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A semver pre-release tag (v0.3.0-beta.1) must stay off releases/latest.
        # --latest: GitHub's automatic pick would keep the macOS app's v26.1.1 on releases/latest.
        run: |
          case "$GITHUB_REF_NAME" in *-*) channel=--prerelease ;; *) channel=--latest ;; esac
          gh release create "$GITHUB_REF_NAME" cleaner-* --repo "$GITHUB_REPOSITORY" --generate-notes $channel
